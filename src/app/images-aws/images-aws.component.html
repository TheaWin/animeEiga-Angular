<div>
  <app-nav-bar></app-nav-bar>
  <div class="image-container">
    <h2>Image Gallery</h2>
    <input type="file" (change)="onFileSelected($event)" />
    <button (click)="onUpload()" [disabled]="!selectedFile">Upload</button>
  </div>

  <div class="image-display">
    <h2>Original Images</h2>
    <div class="images-list">
      <div *ngFor="let image of originalImages" class="image-item">
        <img [src]="image" alt="Original image" />
      </div>
    </div>

    <h2>Resized Images</h2>
    <div class="images-list">
      <div *ngFor="let image of resizedImages" class="image-item">
        <img [src]="image" alt="Resized image" />
      </div>
    </div>
  </div>
</div>
